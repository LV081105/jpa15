info:
  name: Alta Canción
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/jpa-ejemplo/SvCancionCrear?titulo=CAPS&duracion=4.44&anio=2026
  params:
    - name: titulo
      value: CAPS
      type: query
    - name: duracion
      value: "4.44"
      type: query
    - name: anio
      value: "2026"
      type: query
  body:
    type: form-urlencoded
    data:
      - name: titulo
        value: CAPS
      - name: duracion
        value: "4.44"
      - name: anio
        value: "2026"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
